dataset_root: "/home/ubuntu/dataset/lerobot_dataset/crane_plus_inspect_trim_tt"  # 【改変】講義: crane_plus_pekori(独自タスク inspect。静止削除 + environment_state を [対象方向, 経過時間x4] にした版)
repo_id: "crane_plus_inspect_trim_tt"  # 【改変】講義: crane_plus_pekori
output_directory: "/home/ubuntu/checkpoints/train/crane_plus_inspect_act_tt"  # 【改変】講義: crane_plus_pekori_act
